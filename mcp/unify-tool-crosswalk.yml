mcp_only:
  - tool: run_agent
    category: agent-lifecycle
    reason: >-
      Starts Unify's general-purpose Agent (the same Agent behind Unify Chat) on a natural-language task. No REST equivalent is published; the Agent surface is MCP-only.
  - tool: poll_agent
    category: agent-lifecycle
    reason: >-
      Polls a run started by run_agent for PENDING / CLARIFICATION_NEEDED / READY / ERROR / NOT_FOUND. No public REST operation.
  - tool: answer_question
    category: agent-lifecycle
    reason: >-
      Answers the questions from a CLARIFICATION_NEEDED run and resumes it. No public REST operation.
  - tool: read_agent_results
    category: agent-lifecycle
    reason: >-
      Reads the final answer or error from a terminal run. No public REST operation.
  - tool: cancel_agent
    category: agent-lifecycle
    reason: >-
      Stops an in-flight Agent run. No public REST operation.
  - tool: list_agent_runs
    category: agent-lifecycle
    reason: >-
      Lists the current user's Agent runs, cursor-paginated. No public REST operation.
  - tool: get_me
    category: context
    reason: >-
      Returns the authenticated user profile and workspace identity. No public REST operation.
  - tool: load_datatable
    category: context
    reason: >-
      Loads a Unify DataTable the calling user owns, with columns and a cursor-paginated page of rows. DataTables are an Agent-run output type with no public REST surface.
  - tool: load_mailbox_voice_profile
    category: context
    reason: >-
      Loads the writing voice profile for a connected mailbox. Mailboxes are not exposed by any public REST API.
  - tool: load_general_context
    category: context
    reason: >-
      Loads a version of the user's general business context (business description, ICP). No public REST operation.
  - tool: search_unify
    category: documentation
    reason: >-
      Documentation search on the separate anonymous docs MCP server; backs no Unify API operation.
  - tool: query_docs_filesystem_unify
    category: documentation
    reason: >-
      Read-only virtual-filesystem query over the documentation corpus on the docs MCP server; backs no Unify API operation.
  - tool: submit_feedback
    category: documentation
    reason: >-
      Submits documentation feedback on the docs MCP server; backs no Unify API operation.
