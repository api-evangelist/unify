    spec: openapi/unify-sequence-enrollments-api-openapi.yml
  - operation: cancel_task_query_job
    category: bulk-export
    http: POST /tasks/v1/tasks/query-jobs/{job_id}/cancel
    spec: openapi/unify-tasks-api-openapi.yml
  - operation: send_identify_event
    category: analytics-ingest
    http: POST /identify
    spec: openapi/unify-events-api-openapi.yml
  - operation: send_page_event
    category: analytics-ingest
    http: POST /page
    spec: openapi/unify-events-api-openapi.yml
  - operation: send_track_event
    category: analytics-ingest
    http: POST /track
    spec: openapi/unify-events-api-openapi.yml
rest_only_analysis:
  - group: bulk-export
    detail: >-
      Four of the five query-job families expose create / list / get / results as
      MCP tools but omit the cancel operation. Only
      cancel_sequence_enrollment_step_query_job is published as a tool, so an agent
      can start a long-running export through MCP but cannot stop four of the five
      kinds without dropping to REST.
  - group: analytics-ingest
    detail: >-
      The three Analytics write operations (identify / page / track) have no MCP
      tool. They authenticate with HTTP Basic and a public write key intended for
      browser-side collection, a different auth model from the x-api-key /
      OAuth-user model every MCP tool runs under, which is a coherent reason for
      the omission rather than a gap.
