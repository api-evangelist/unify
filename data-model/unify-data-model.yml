entities:
  - name: object
    description: A data-platform object (table). Standard objects ship built in
      (company, person, user); custom objects can be created via the Data API.
  - name: attribute
    description: A field on an object, with a type (text, url, email address,
      reference, datetime, etc.) and optional uniqueness.
  - name: attribute_option
    description: An allowed option value for a select-style attribute.
  - name: record
    description: A row of an object, addressed by id or found/upserted via
      unique attribute values.
  - name: company
    description: Standard object representing an organization; deduplicated by
      normalized unique domain.
  - name: person
    description: Standard object representing an individual, unique by email.
  - name: user
    description: Standard object representing a Unify user (record owners).
  - name: sequence
    description: An outbound sequence with ordered steps (Sequences API).
  - name: sequence_step
    description: A step within a sequence.
  - name: sequence_enrollment
    description: A person's enrollment in a sequence, with pause/resume state.
  - name: sequence_enrollment_step
    description: One executed step of a sequence enrollment; exported through the
      Bulk API rather than read individually.
  - name: task
    description: >-
      A unit of outreach work - an email, phone call, LinkedIn touch, or manual
      action item - tied to a person and assigned to a user, carrying its own
      type, status, priority and due date. Added by the Tasks API
      (api.unifygtm.com/tasks/v1), new since the previous derivation.
  - name: analytics_event
    description: >-
      An identify, page, or track event collected from a website or product by the
      Intent client and posted to the Analytics API. Not individually addressable;
      exported in bulk through event query jobs.
  - name: query_job
    description: >-
      Asynchronous Bulk API job. Five families now exist - object records, events,
      sequence enrollments, sequence enrollment steps, and tasks - each with the
      same create / list / get / cancel / results lifecycle.
