generated: '2026-08-13'
method: searched
source: live probe of every Unify host on 2026-08-13
summary: >-
  Unify does serve a real /.well-known/ discovery surface, but it is split across
  three hosts and none of it sits on the marketing domain. The documentation host
  (docs.unifygtm.com) serves an A2A agent card, an agent-skills discovery index and
  an MCP manifest; the identity host (auth.unifygtm.com, a custom-domain Auth0
  tenant) serves full RFC 8414 / OIDC discovery; and the GTM MCP host
  (mcp.unifygtm.com) serves an RFC 9728 protected-resource document under a
  sub-path. No security.txt (RFC 9116) and no api-catalog (RFC 9727) are served
  anywhere. The previous round of this probe checked only www/docs/app and
  concluded the surface was empty; that conclusion is superseded.
hosts:
  - host: https://docs.unifygtm.com
    role: documentation (Mintlify)
    documents:
      - path: /.well-known/agent-card.json
        status: 200
        content_type: application/json
        file: ../a2a/unify-agent-card.json
        spec: A2A 1.0.0
        note: Saved under a2a/ and graded in a2a/unify-a2a.yml.
      - path: /.well-known/agent-skills/index.json
        status: 200
        content_type: application/json
        file: unify-agent-skills-index.json
        spec: agentskills.io discovery 0.2.0
        note: >-
          Lists one skill ("unify", type skill-md) with a sha256 digest, served at
          /.well-known/agent-skills/unify/skill.md. The skill body is captured at
          skills/unify-docs-agent-skill.md.
      - path: /.well-known/agent-skills/unify/skill.md
        status: 200
        content_type: text/markdown
        file: ../skills/unify-docs-agent-skill.md
      - path: /.well-known/mcp.json
        status: 200
        content_type: application/json
        file: unify-mcp.json
        note: >-
          Declares an anonymous HTTP MCP server. The url it advertises
