gaps:
  - path: /.well-known/security.txt
    status: 404 on every host
    impact: >-
      No RFC 9116 security contact is machine-discoverable. Unify does publish a
      security address (security@unifygtm.com, on the pricing FAQ) and a trust
      centre, so the contact exists - only the well-known document is missing.
  - path: /.well-known/api-catalog
    status: 404 on every host
    impact: >-
      The four OpenAPI documents are individually reachable at
      <api-host>/<service>/v1/openapi.json but are not linked from an RFC 9727
      catalogue, so an agent must already know the service names to find them.
