aid: unify
name: Unify
description: Unify is a B2B outbound and go-to-market platform that pairs AI agents with reps to find
  buyers already in market and reach them with the right message, combining 40+ data sources, 1.1B+ contacts
  and 65M+ companies with intent signals, automated Plays and multi-channel sequences. Founded in 2023
  and backed by $52M+ from the OpenAI Startup Fund, Thrive Capital, Battery Ventures and Emergence Capital,
  Unify publishes four anonymous OpenAPI 3.0 documents covering 68 operations across Data, Sequences,
  Tasks and Analytics, official Python and TypeScript SDKs, browser intent clients, a hosted OAuth-protected
  MCP server exposing 71 tools, provider-published agent skills, and an A2A agent card.
