currency:
  checked: '2026-08-13'
  finding: >-
    Both first-party SDKs are still on 0.1.3, published 2026-04-23. The APIs they
    wrap have moved since: the Tasks API (11 operations) and the query-job/bulk
    export families on Data, Sequences and Tasks are all present in the live
    OpenAPI documents harvested 2026-08-13, and the Tasks API shipped after the
    "Unify API" changelog entry of 2026-05-21 - after the last SDK release. The
    source repositories were pushed in mid-June 2026 but nothing has been
    published to npm or PyPI since April, so an SDK consumer is roughly one API
    generation behind and must drop to raw HTTP for Tasks and for parts of Bulk.
  intent_client_note: >-
    The Intent clients (1.9.5, 2025-12-20) are older still, but they wrap the
    3-operation Analytics API, which has not changed in the same window - staleness
    there is much less consequential.
