format_note: >-
  NOT RFC 9457. Every error response is media type application/json (344 error
  response bodies across the four documents; no application/problem+json anywhere)
  and every one shares the same two-field envelope: a machine-readable `status`
  string enum and a human `message`. Richer failures extend that envelope with
  extra top-level fields via allOf rather than RFC 9457 extension members. The
  envelope is consistent and discriminated, which is most of what an agent needs -
  what it lacks is `type`/`title`/`instance` and a documented registry of the
  `status` values.
