gaps:
  - id: no-error-code-registry
    detail: >-
      Unify publishes no error-code reference page. The `status` enum values are
      only discoverable by reading the named schemas in the OpenAPI, and the six
      generic classes (400/401/403/429/500/503) declare no schema at all, so their
      status values are not published in any form.
  - id: analytics-declares-no-429
    detail: >-
      The Analytics API declares 200/202/401 only. It has a documented
      100,000-per-5-minute rate limit but no 429 response in its contract, so a
      generated client will not model throttling on the ingest path.
  - id: not-rfc9457
    detail: >-
      No application/problem+json, no type URI, no problem-type registry. The
      envelope is consistent, so the cost is interoperability rather than
      ambiguity.
