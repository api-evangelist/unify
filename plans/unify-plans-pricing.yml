api_access:
  gated_to: Business
  evidence: >-
    The plan-comparison table lists "Open API + webhooks" as available on Business
    only (a dash on Free, Base and Pro). The developer APIs documented at
    docs.unifygtm.com are therefore an enterprise-tier entitlement even though the
    OpenAPI documents themselves are served publicly and anonymously.
  impact: >-
    An agent or integrator can read every Unify contract without an account, but
    cannot obtain a working API key below the custom-priced Business plan.
credits:
  unit: credit
  definition: >-
    "Credits are the currency used to purchase different data points and actions in
    Unify. Most actions require 1-2 credits, but the value varies by provider."
  published_action_costs:
    - action: email enrichment
      average_credits: 1
      worst_case_credits: 10
    - action: phone enrichment
      average_credits: 4
      worst_case_credits: 20
    - action: web intent / technographic signals
      average_credits: 1
      note: Other signal sources are described as significantly higher; no per-source table is published.
  top_ups:
    available_on: [Base, Pro, Business]
    one_time: true
    auto_renew: false
    shared_pool: true
    rollover_months: 12
  hard_cap:
    enforced: true
    behaviour: >-
      When seat credits and the account pool are both exhausted, credit-consuming
      actions pause rather than charge; an in-product prompt offers a top-up or
      upgrade, and any automation already in flight finishes its current step
      before stopping.
  llm_billing: >-
    AI usage is billed out of the credit balance - the model cost is passed through
    with no separate AI fee or subscription.
