components:
  schemas:
    CreateRecordRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UValues.UValue'
          description: 'The attribute values for the new record.


            All required attributes on the object must be included.'
      description: Request body for creating a record.
    FindUniqueRecordRequest:
      type: object
      required:
      - match
      properties:
        match:
          type: object
          additionalProperties:
            allOf:
            - $ref: '#/components/schemas/UValues.UValue'
            nullable: true
          description: 'The attribute values to match against to find an existing record.


            At least one unique attribute must be included to ensure that at most one

            record is matched. Additional unique or non-unique attributes may also be

            included to refine the matching criteria.'
      description: Request body for finding a unique record by attribute values.
    UObjects.UObjectName:
      type: string
      description: 'The API name of an object, e.g. `company`, `person`, `opportunity`, or a

        custom object''s API name.'
    UResponses.BadRequestError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
        path:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        object_api_name:
          type: string
        attribute_api_name:
          type: string
      allOf:
      - type: object
        additionalProperties: {}
      description: Validation error detail returned for bad request responses.
    UValues.UAddress:
      type: object
      properties:
        country:
          allOf:
          - $ref: '#/components/schemas/UValues.UCountry'
          description: Country code in ISO 3166-1 alpha-2 format.
        administrative_area:
          type: string
          description: State, province, region, or territory.
        sub_administrative_area:
          type: string
          description: County or other secondary governmental division of an administrative area.
        locality:
