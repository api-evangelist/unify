        explode: false
      - name: person_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/uuid'
        explode: false
      - name: mailbox_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/uuid'
        explode: false
      - name: status
        in: query
        required: false
