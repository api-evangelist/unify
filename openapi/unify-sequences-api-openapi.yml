components:
  schemas:
    BulkApiUuidFilter:
      type: object
      required:
      - id
      properties:
        id:
          type: string
      description: Filter matching a resource by ID.
    SequenceStepTimerCondition:
      type: object
      required:
      - type
      - duration_value
      - duration_unit
      properties:
        type:
          type: string
          enum:
          - TIMER
        duration_value:
          type: integer
          nullable: true
        duration_unit:
          $ref: '#/components/schemas/SequenceTimerConditionDurationUnit'
      description: Timer condition embedded in sequence step responses.
    Sequence:
      type: object
      required:
      - id
      - created_at
      - updated_at
      - owner
      - name
      - is_paused
      - send_schedule
      - sequence_ruleset
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        created_at:
          $ref: '#/components/schemas/datetime'
        updated_at:
          $ref: '#/components/schemas/datetime'
        owner:
          $ref: '#/components/schemas/SequenceOwner'
        name:
          type: string
        is_paused:
          type: boolean
        send_schedule:
          type: object
          allOf:
          - $ref: '#/components/schemas/SequenceSendSchedule'
          nullable: true
        sequence_ruleset:
          type: object
          allOf:
          - $ref: '#/components/schemas/SequenceRuleset'
          nullable: true
      description: A sequence.
    RetrieveManualEmailSequenceStepResponse:
      type: object
      allOf:
      - $ref: '#/components/schemas/ManualEmailSequenceStep'
      description: Response returned when retrieving a manual email sequence step.
    EmailSendWindowTime:
      type: object
      required:
      - hour
      - minute
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
      description: Local wall-clock time used in a sequence email send window.
    uuid:
      type: string
      format: uuid
      description: String UUID value.
    SequenceStep:
      anyOf:
      - $ref: '#/components/schemas/AutomaticEmailSequenceStep'
      - $ref: '#/components/schemas/ManualEmailSequenceStep'
      - $ref: '#/components/schemas/TaskSequenceStep'
      description: A sequence step in any of its variants.
    SequenceEnrollmentStepType:
      type: string
      enum:
      - AUTOMATIC_EMAIL
      - MANUAL_EMAIL
      - ACTION_ITEM
      - ZAPIER
      - PHONE_CALL
      - MANUAL_LINKEDIN_PROFILE_VIEW
      - MANUAL_LINKEDIN_CONNECTION
      - MANUAL_LINKEDIN_MESSAGE
      description: Type of a sequence enrollment step.
    SequenceCompany:
      type: object
      required:
      - id
      - name
      - domain
      - linkedin_url
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        domain:
          type: string
        description:
          type: string
          nullable: true
          description: Present in enrollment results and omitted in step results.
        linkedin_url:
          type: string
          nullable: true
      description: Company details embedded in sequence Bulk API results.
    PauseEnrollmentSuccessResponse:
      type: object
      required:
      - id
      - is_paused
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        is_paused:
          type: boolean
          enum:
          - true
      description: Response returned when pausing an enrollment.
    BulkApiJob:
      type: object
      required:
      - job_id
      - status
      - total_rows
      - error_code
      - created_at
      - expires_at
      - canceled_at
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/BulkApiJobStatus'
        total_rows:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
        expires_at:
          type: string
        canceled_at:
          type: string
          nullable: true
      description: Bulk API job representation.
    ListEnrollmentsResponse:
      type: object
      required:
      - enrollments
      - next_cursor
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
