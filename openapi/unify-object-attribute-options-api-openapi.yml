      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UObjects.UAttributeOptionUpdate'
    delete:
      operationId: delete_object_attribute_option
      parameters:
      - name: object_name
        in: path
        required: true
        schema:
          type: string
      - name: attribute_name
        in: path
        required: true
        schema:
          type: string
      - name: option_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Response for a successful delete operation.
          content:
