        title:
          type: string
          description: Page title (equivalent to `document.title`).
        url:
          type: string
          description: URL of the page (equivalent to `location.href`).
      unevaluatedProperties: {}
      description: Details about an event included in a track request.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: Basic
