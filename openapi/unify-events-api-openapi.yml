      description: Composite object representing a currency value.
      title: UCurrency
    TrackProperties:
      type: object
      properties:
        path:
          type: string
          description: Path of the page (equivalent to `location.pathname`).
        query:
          type: object
          unevaluatedProperties:
            type: string
