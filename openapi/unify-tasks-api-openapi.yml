components:
  schemas:
    BaseCreateTaskRequest:
      type: object
      required:
      - person_id
      properties:
        person_id:
          $ref: '#/components/schemas/uuid'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        due_at:
          type: string
          format: date-time
          nullable: true
    BulkApiDatetimeRangeFilter:
      type: object
      properties:
        gt:
          type: string
        gte:
          type: string
        lt:
          type: string
        lte:
          type: string
      description: 'Datetime range filter. At least one bound must be provided. `gt` is mutually

        exclusive with `gte`, and `lt` is mutually exclusive with `lte`.'
    BulkApiJob:
      type: object
      required:
      - job_id
      - status
      - total_rows
      - error_code
      - created_at
      - expires_at
      - canceled_at
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/BulkApiJobStatus'
        total_rows:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
        expires_at:
          type: string
        canceled_at:
          type: string
          nullable: true
      description: Bulk API job representation.
    BulkApiJobStatus:
      type: string
      enum:
      - IN_PROGRESS
      - FINISHED
      - FAILED
      - EXPIRED
      - CANCELED
      description: Status of an asynchronous Bulk API job.
    BulkApiUuidFilter:
      type: object
      required:
      - id
      properties:
        id:
          type: string
      description: Filter matching a resource by ID.
    CancelBulkApiJobNotCancelableResponse:
      type: object
      allOf:
      - type: object
        required:
        - status
        - message
        properties:
          status:
            type: string
            enum:
            - job_not_cancelable
          message:
            type: string
        description: Response for any operation that results in a conflict error.
      description: Response returned when a Bulk API job is not cancelable.
    CancelBulkApiJobSuccessResponse:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - CANCELED
      description: Response returned when canceling a Bulk API job.
    CreateActionItemTaskRequest:
      type: object
      allOf:
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - ACTION_ITEM
          note_content:
            type: string
            nullable: true
        allOf:
        - $ref: '#/components/schemas/BaseCreateTaskRequest'
    CreateBulkApiJobSuccessResponse:
      type: object
      required:
      - job_id
      - status
      - expires_at
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
        expires_at:
          type: string
      description: Response returned when creating a Bulk API query job.
    CreateBulkApiTasksJobFilter:
      type: object
      properties:
        updated_at:
          $ref: '#/components/schemas/BulkApiDatetimeRangeFilter'
        created_at:
          $ref: '#/components/schemas/BulkApiDatetimeRangeFilter'
        due_at:
          $ref: '#/components/schemas/BulkApiDatetimeRangeFilter'
        ended_at:
          $ref: '#/components/schemas/BulkApiDatetimeRangeFilter'
        id:
          anyOf:
          - type: object
            required:
            - in
            properties:
              in:
                type: array
                items:
                  type: string
                minItems: 1
              not_in:
                type: array
                items:
                  type: string
                minItems: 1
            description: Filter matching values included in a set.
          - type: object
            required:
            - not_in
            properties:
              in:
                type: array
                items:
                  type: string
                minItems: 1
              not_in:
                type: array
                items:
                  type: string
                minItems: 1
            description: Filter matching values excluded from a set.
        status:
          anyOf:
          - type: object
            required:
            - in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStatus'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStatus'
                minItems: 1
            description: Filter matching values included in a set.
          - type: object
            required:
            - not_in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStatus'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskStatus'
                minItems: 1
            description: Filter matching values excluded from a set.
        type:
          anyOf:
          - type: object
            required:
            - in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskType'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskType'
                minItems: 1
            description: Filter matching values included in a set.
          - type: object
            required:
            - not_in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskType'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskType'
                minItems: 1
            description: Filter matching values excluded from a set.
        priority:
          anyOf:
          - type: object
            required:
            - in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskPriority'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskPriority'
                minItems: 1
            description: Filter matching values included in a set.
          - type: object
            required:
            - not_in
            properties:
              in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskPriority'
                minItems: 1
              not_in:
                type: array
                items:
                  $ref: '#/components/schemas/TaskPriority'
                minItems: 1
            description: Filter matching values excluded from a set.
        assigned_user:
          $ref: '#/components/schemas/BulkApiUuidFilter'
        person:
          $ref: '#/components/schemas/BulkApiUuidFilter'
        company:
          $ref: '#/components/schemas/BulkApiUuidFilter'
      description: Filters accepted when querying tasks.
    CreateBulkApiTasksJobRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/CreateBulkApiTasksJobFilter'
      description: Request body for creating a tasks Bulk API query job.
    CreateEmailTaskRequest:
      type: object
      required:
      - type
      - mailbox_email
      - subject
      - content
      properties:
        type:
          type: string
          enum:
          - EMAIL
        mailbox_email:
          allOf:
          - $ref: '#/components/schemas/email'
          description: Email address of the mailbox used to send the email when the task is completed.
        subject:
          type: string
          description: Email subject. May be empty while the task is a draft.
        content:
          type: string
          description: Email body. May be empty while the task is a draft.
        cc_recipients:
          type: array
          items:
            $ref: '#/components/schemas/email'
          description: Additional email recipients. The task's person is the primary recipient.
        bcc_recipients:
          type: array
          items:
            $ref: '#/components/schemas/email'
          description: Blind-copy email recipients.
      allOf:
      - $ref: '#/components/schemas/BaseCreateTaskRequest'
    CreateLinkedinSendConnectionRequestTaskRequest:
