exhaustion:
  status_code: 429
  status_text: Too Many Requests
  documented_in_openapi: true
  openapi_evidence: >-
    429 responses are declared on 44 of the 68 operations across the Data,
    Sequences and Tasks specs (every Sequences and Tasks operation, and every
    query-job operation on the Data API). The Analytics API declares only 200/202/401
    and does not declare a 429 response.
  guidance: >-
    "429 Too Many Requests, wait before retrying, honor the Retry-After header to
    avoid additional rate limiting."
response_headers:
  - name: Retry-After
    documented: true
    standard: RFC 9110
    on: 429
    source: https://docs.unifygtm.com/developers/guides/request-data/bulk-api
    note: The only rate-limit response header Unify documents.
  - name: X-RateLimit-Limit
    documented: false
  - name: X-RateLimit-Remaining
    documented: false
  - name: X-RateLimit-Reset
    documented: false
  - name: RateLimit
    documented: false
    standard: draft-ietf-httpapi-ratelimit-headers
gaps:
  - id: no-quota-headers
    detail: >-
      Because no X-RateLimit-*/RateLimit-* headers are documented, a client cannot
      read its remaining quota before exhausting it - it can only react to a 429.
      For an agent driving the Bulk API against a ~5 requests/second results limit,
      that is the difference between pacing and retrying.
  - id: 429-undeclared-on-analytics
    detail: >-
      The Analytics OpenAPI declares no 429 response even though the docs publish a
      100,000/5-minute limit for that API, so a generated client will not model
      throttling on the highest-volume ingest path.
agent_credit_limits:
  note: >-
    Separate from HTTP rate limiting, MCP Agent runs are subject to per-user rate
    limiting and require available workspace chat credits; both surface as a tool
    error rather than a silent failure. See plans/unify-plans-pricing.yml.
  source: https://docs.unifygtm.com/developers/mcp/tools
