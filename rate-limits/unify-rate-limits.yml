summary: >-
  Every synchronous Unify API publishes the same headline limit - 100,000 requests
  per five-minute window - and each service page warns that daily limits may be
  introduced later. The Bulk API (query jobs) is limited separately and far more
  tightly, by operation type. Retry-After is documented as the honoured backoff
  signal on 429; no X-RateLimit-*/RateLimit-* response headers are documented
  anywhere in the developer docs.
